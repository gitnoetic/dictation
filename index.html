<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣小學生聽寫測驗站</title>
    <style>
        body { font-family: "Microsoft JhengHei", Arial, sans-serif; background-color: #f4f7f6; color: #333; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 20px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #34495e; }
        textarea, input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        textarea { height: 120px; resize: vertical; }
        button { background-color: #3498db; color: white; border: none; padding: 12px 25px; font-size: 18px; border-radius: 6px; cursor: pointer; width: 100%; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #2980b9; }
        
        #examMode { display: none; background-color: #2c3e50; color: white; padding: 40px 20px; border-radius: 12px; margin-top: 20px; }
        #status { font-size: 32px; font-weight: bold; color: #f1c40f; min-height: 45px; margin-bottom: 15px; }
        #countdown { font-size: 22px; color: #ecf0f1; font-weight: bold; min-height: 30px; margin-bottom: 25px; }
        
        .exam-btn { width: 48%; display: inline-block; margin: 5px 1%; }
        .hint { font-size: 13px; color: #7f8c8d; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 台灣小學生聽寫測驗站</h1>
    
    <div id="setupArea">
        <div class="form-group">
            <label for="words">1. 輸入聽寫詞語（每行一個詞）：</label>
            <textarea id="words" placeholder="例如：&#10;拍手&#10;高興&#10;小鳥&#10;寫字">拍手
高興
小鳥
寫字</textarea>
        </div>

        <div class="form-group">
            <label for="interval">2. 詞語間隔時間（秒）：</label>
            <input type="number" id="interval" value="12" min="3">
            <div class="hint">建議：小一孩子寫字較慢，建議設 12-15 秒。</div>
        </div>

        <div class="form-group">
            <label for="rate">3. 朗讀速度（語速）：</label>
            <select id="rate">
                <option value="0.6">非常慢 (0.6)</option>
                <option value="0.7" selected>稍微慢 (0.7) - 推薦小一</option>
                <option value="1.0">正常速度 (1.0)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="repeat">4. 每個詞重複朗讀次數：</label>
            <select id="repeat">
                <option value="1">念 1 次</option>
                <option value="2" selected>念 2 次（中間停頓 2 秒）</option>
                <option value="3">念 3 次</option>
            </select>
        </div>

        <div class="form-group">
            <label for="orderMode">5. 聽寫朗讀順序：</label>
            <select id="orderMode">
                <option value="normal" selected>依序朗讀（從第一題照順序往下唸）</option>
                <option value="random">隨機排序（打亂順序，每次考試都不同）</option>
            </select>
        </div>

        <button id="startBtn" onclick="startDictation()">▶️ 開始聽寫測驗</button>
    </div>

    <div id="examMode">
        <div id="status">準備就緒</div>
        <div id="countdown"></div>
        <div>
            <button id="nextBtn" class="exam-btn" onclick="skipToNext()" style="background-color: #2ecc71;">⏭️ 手動下一題</button>
            <button id="stopBtn" class="exam-btn" onclick="stopDictation()" style="background-color: #e74c3c;">⏹️ 停止測驗</button>
        </div>
    </div>
</div>

<script>
    let timer = null;
    let countdownTimer = null;
    let wakeLock = null;
    let wordList = [];
    let currentIndex = 0;
    let isPlaying = false; 
    let flowToken = 0; 
    const synth = window.speechSynthesis;

    async function requestWakeLock() {
        if ('navigator' in window && 'wakeLock' in navigator) {
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
        }
    }

    function releaseWakeLock() {
        if (wakeLock !== null) {
            try { wakeLock.release(); } catch (err) {}
            wakeLock = null;
        }
    }

    function setBestVoice(utterance) {
        if (!synth) return;
        const voices = synth.getVoices();
        const targetVoice = voices.find(v => v.lang === 'zh-TW' || v.lang === 'zh-tw') || 
                            voices.find(v => v.lang.includes('zh'));
        if (targetVoice) { utterance.voice = targetVoice; }
        utterance.lang = 'zh-TW';
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function startDictation() {
        const text = document.getElementById('words').value.trim();
        if (!text) {
            alert('請先輸入聽寫詞語！');
            return;
        }

        flowToken++; 
        const currentToken = flowToken;

        if (synth) {
            synth.cancel();
        }
        clearTimeout(timer);
        clearInterval(countdownTimer);

        wordList = text.split('\n').map(w => w.trim()).filter(w => w.length > 0);
        
        const orderMode = document.getElementById('orderMode').value;
        if (orderMode === 'random') {
            shuffleArray(wordList);
        }

        currentIndex = 0;
        isPlaying = true; 
        
        document.getElementById('setupArea').style.display = 'none';
        document.getElementById('examMode').style.display = 'block';
        document.getElementById('nextBtn').style.display = 'inline-block'; 
        document.getElementById('countdown').innerText = '';
        
        requestWakeLock();

        speakNotification("聽寫測驗即將開始，請準備。第一題：", () => {
            if (currentToken !== flowToken || !isPlaying) return;
            playNext(currentToken);
        });
    }

    function playNext(currentToken) {
        if (currentToken !== flowToken || !isPlaying) return;

        if (currentIndex >= wordList.length) {
            finishDictation();
            return;
        }

        if (currentIndex === wordList.length - 1) {
            document.getElementById('nextBtn').style.display = 'none';
        } else {
            document.getElementById('nextBtn').style.display = 'inline-block';
        }

        const currentWord = wordList[currentIndex];
        const repeatCount = parseInt(document.getElementById('repeat').value);
        const rate = parseFloat(document.getElementById('rate').value);

        document.getElementById('status').innerText = `📝 第 ${currentIndex + 1} / ${wordList.length} 題`;
        document.getElementById('countdown').innerText = "👂 專心聽老師唸喔...";

        speakWordRepeatedly(currentWord, rate, repeatCount, () => {
            if (currentToken !== flowToken || !isPlaying) return;
            startIntervalCountdown(currentToken);
        }, currentToken);
    }

    function speakWordRepeatedly(word, rate, remainingTimes, callback, currentToken) {
        if (currentToken !== flowToken || !isPlaying) return;
        if (remainingTimes <= 0) {
            callback();
            return;
        }

        const utterance = new SpeechSynthesisUtterance(word);
        setBestVoice(utterance); 
        utterance.rate = rate;

        utterance.onend = () => {
            if (currentToken !== flowToken || !isPlaying) return;
            if (remainingTimes > 1) {
                timer = setTimeout(() => {
                    if (currentToken !== flowToken || !isPlaying) return;
                    speakWordRepeatedly(word, rate, remainingTimes - 1, callback, currentToken);
                }, 2000);
            } else {
                callback();
            }
        };

        utterance.onerror = () => { 
            if (currentToken !== flowToken || !isPlaying) return;
            callback(); 
        };
        synth.speak(utterance);
    }

    function startIntervalCountdown(currentToken) {
        if (currentToken !== flowToken || !isPlaying) return;
        
        clearInterval(countdownTimer); 
        let secondsLeft = parseInt(document.getElementById('interval').value);
        const isLastWord = (currentIndex === wordList.length - 1);
        
        if (isLastWord) {
            document.getElementById('countdown').innerText = `最後一題作答剩餘 ${secondsLeft} 秒`;
        } else {
            document.getElementById('countdown').innerText = `距離下一題還有 ${secondsLeft} 秒`;
        }

        countdownTimer = setInterval(() => {
            if (currentToken !== flowToken || !isPlaying) {
                clearInterval(countdownTimer);
                return;
            }
            secondsLeft--;
            
            if (secondsLeft <= 0) {
                clearInterval(countdownTimer);
                goToNextQuestion(); 
            } else {
                if (isLastWord) {
                    document.getElementById('countdown').innerText = `最後一題作答剩餘 ${secondsLeft} 秒`;
                } else {
                    document.getElementById('countdown').innerText = `距離下一題還有 ${secondsLeft} 秒`;
                }
            }
        }, 1000);
    }

    function goToNextQuestion() {
        flowToken++; 
        const currentToken = flowToken;

        currentIndex++; 
        if (currentIndex < wordList.length) {
            speakNotification("下一題：", () => {
                if (currentToken !== flowToken || !isPlaying) return;
                playNext(currentToken);
            });
        } else {
            playNext(currentToken); 
        }
    }

    function skipToNext() {
        if (!isPlaying) return;
        
        clearTimeout(timer);
        clearInterval(countdownTimer);
        
        if (synth) {
            synth.cancel(); 
        }
        
        goToNextQuestion(); 
    }

    function speakNotification(text, callback) {
        const utterance = new SpeechSynthesisUtterance(text);
        setBestVoice(utterance); 
        utterance.rate = 0.8;
        if (callback) {
            utterance.onend = () => { callback(); };
            utterance.onerror = () => { callback(); };
        }
        synth.speak(utterance);
    }

    function finishDictation() {
        flowToken++; 
        const currentToken = flowToken;

        document.getElementById('status').innerText = '🎉 測驗結束！好棒！';
        document.getElementById('countdown').innerText = '正在統計成果...';
        
        isPlaying = false; 
        clearTimeout(timer);
        clearInterval(countdownTimer);
        releaseWakeLock(); 
        
        speakNotification("聽寫測驗結束，小朋友辛苦了！", () => {
            if (currentToken !== flowToken) return;
            resetToSetup();
        });
    }

    function stopDictation() {
        flowToken++; 
        isPlaying = false; 
        clearTimeout(timer);
        clearInterval(countdownTimer);
        if (synth) { synth.cancel(); }
        releaseWakeLock(); 
        resetToSetup();
    }

    function resetToSetup() {
        document.getElementById('examMode').style.display = 'none';
        document.getElementById('setupArea').style.display = 'block';
        document.getElementById('status').innerText = '準備就緒';
        document.getElementById('countdown').innerText = '';
    }
</script>

</body>
</html>
